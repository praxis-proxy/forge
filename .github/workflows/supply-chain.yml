name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Advisories are published against a dependency set that does not change
  # when nobody commits, so the scan has to run on a clock, not on pushes.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  # Pinned so the cached binary is replaced when the tool is upgraded. With a
  # constant cache key the `command -v` guard below would keep whichever
  # version first populated the cache, freezing the scanner indefinitely.
  # Dependabot cannot bump these, so raise them by hand when a scanner
  # release lands; a stale pin under-reports advisories just as a stale
  # cache did.
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  security-audit:
    name: Cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      # Cache only the tool binary: caching all of ~/.cargo/bin would also
      # capture the runner image's rustup proxy shims (cargo, rustc, ...)
      # and restore stale copies over a freshly configured toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-tool-audit-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: |
          command -v cargo-audit \
            || cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - run: cargo audit

  dependency-check:
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      # See the cargo-audit cache above: only the tool binary is cached.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-tool-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          command -v cargo-deny \
            || cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - run: cargo deny check

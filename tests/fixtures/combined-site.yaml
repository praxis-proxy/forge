apiVersion: forge.praxis.dev/v1alpha1
kind: Environment

metadata:
  name: combined-site

spec:
  runtime:
    provider: docker
    clusterPrefix: combined

  network:
    crossCluster: true
    dnsZone: combined.test

  clusters:
    - name: west
      stacks: [metallb, operator, site, gateway]
      properties:
        region: west
        role: combined
        siteName: west

    - name: central
      stacks: [metallb, operator, site, gateway]
      properties:
        region: central
        role: combined
        siteName: central

    - name: east
      stacks: [metallb, operator, site, gateway]
      properties:
        region: east
        role: combined
        siteName: east

  stacks:
    metallb:
      description: MetalLB load balancer with auto-configured address pool
      steps:
        - type: url
          url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
          sha256: 951065e85692aa106f1bb5d5a487d9306154923a794ab1d82122881cbaf588e4
        - type: wait
          resource: deployment/controller
          namespace: metallb-system
          condition: available
          timeout: "120s"
        - type: metallb-auto-pool
          name: forge-pool

    operator:
      description: Operator with SWIM capture
      steps:
        - type: helm
          release: operator
          chart: charts/operator
          version: "0.1.0"
          namespace: app-system
          values:
            swim:
              siteName: "{{ cluster.properties.siteName }}"
              seeds: ""
              service:
                enabled: true
                type: LoadBalancer
        - type: wait
          resource: deployment/operator
          namespace: app-system
          condition: available
          timeout: "120s"
        - type: capture
          resource: svc/operator-swim
          namespace: app-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: swim-lb-ip
          timeout: "60s"
          interval: "2s"

    site:
      description: Site CRs
      steps:
        - type: manifest
          path: resources/site-{{ cluster.properties.siteName }}.yaml

    gateway:
      description: Gateway with template-file and capture
      steps:
        - type: template-file
          source: configs/gateway/config.yaml
          target: .forge/runtime/{{ cluster.name }}/gateway/config.yaml
        - type: helm
          release: gateway
          chart: charts/gateway
          version: "0.1.0"
          namespace: app-system
          values:
            image:
              pullPolicy: Never
            service:
              type: LoadBalancer
        - type: wait
          resource: deployment/gateway
          namespace: app-system
          condition: available
          timeout: "120s"
        - type: capture
          resource: svc/gateway
          namespace: app-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: gateway-ip
          timeout: "60s"
          interval: "2s"
